<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transform Transition Animation</title>

<style>

.box{
    width:100px;
    height:100px;
    background:skyblue;
    margin:20px;
    display:inline-block;
    text-align:center;
    line-height:100px;
    font-weight:bold;
}

.rotate{
    transform: rotate(30deg);
}

.scale{
    transform: scale(1.3);
}

.translate{
    transform: translate(50px,20px);
}

.skew{
    transform: skew(20deg,10deg);
}

.transition-box{
    width:100px;
    height:100px;
    background:orange;
    margin:20px;
    text-align:center;
    line-height:100px;
    font-weight:bold;
    transition: transform 0.7s;
}

.transition-box:hover{
    transform: scale(1.3) rotate(15deg);
}

@keyframes boxAnimation{
    10%{
        transform: translateX(0);
    }

    100%{
        transform: translateX(100px);
    }
}


.animation-box{
    width:150px;
    height:150px;
    background:red;
    margin:20px;
    text-align:center;
    line-height:150px;
    color:white;
    animation: boxAnimation 3s infinite;
}

</style>
</head>

<body>

<h2>Transform</h2>

<div class="box rotate">Rotate</div>
<div class="box scale">Scale</div>
<div class="box translate">Translate</div>
<div class="box skew">Skew</div>

<h2>Transition</h2>

<div class="transition-box">
Hover me
</div>

<h2>Animation</h2>

<div class="animation-box">
Move
</div>

</body>
</html>
