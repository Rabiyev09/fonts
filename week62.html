<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transform Transition Animation</title>

<style>
/*<--- общий стиль для всех блоков --->*/
.box{
    width:100px;
    height:100px;
    background:skyblue;
    margin:20px;
    display:inline-block;
    text-align:center;
    line-height:100px;
    font-weight:bold;
}
/*<!--- rotate поворачивает элемент на 30 градусов --->*/
.rotate{
    transform: rotate(30deg);
}
/*<--- scale увеличивает элемент в 1.3 раза --->*/
.scale{
    transform: scale(1.3);
}
/*<--- translate перемещает элемент на 50px по X и 20px по Y --->*/
.translate{
    transform: translate(50px,20px);
}
/*<--- skew наклоняет элемент по осям X и Y --->*/
.skew{
    transform: skew(20deg,10deg);
}
/*<--- блок для задания transition --->*/
.transition-box{
    width:100px;
    height:100px;
    background:orange;
    margin:20px;
    text-align:center;
    line-height:100px;
    font-weight:bold;
    transition: transform 0.7s; /*--- transition делает изменение transform плавным (0.7 секунды) ---*/
}

.transition-box:hover{
    transform: scale(1.3) rotate(15deg);
}

@keyframes boxAnimation{
    10%{
        transform: translateX(0);
    }

    100%{
        transform: translateX(100px);
    }
}

/*<--- блок, который использует animation --->*/
.animation-box{
    width:150px;
    height:150px;
    background:red;
    margin:20px;
    text-align:center;
    line-height:150px;
    color:white;
    animation: boxAnimation 3s infinite;
}

</style>
</head>

<body>

<h2>Transform</h2>

<div class="box rotate">Rotate</div>
<div class="box scale">Scale</div>
<div class="box translate">Translate</div>
<div class="box skew">Skew</div>

<h2>Transition</h2>

<div class="transition-box">
Hover me
</div>

<h2>Animation</h2>
<!-- Блок двигается с помощью keyframes -->
<div class="animation-box">
Move
</div>

</body>
</html>
